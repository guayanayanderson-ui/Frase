<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Amo Mi Princesa</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #030a1a;
  min-height: 100vh;
  width: 100vw;
  overflow: hidden;
  font-family: Georgia, serif;
}

/* Estrellas absolutas como texto */
.star {
  position: fixed;
  color: white;
  font-style: normal;
  line-height: 1;
  animation: twinkle var(--d) ease-in-out infinite var(--del);
  z-index: 1;
  pointer-events: none;
}

@keyframes twinkle {
  0%,100% { opacity: 1;    transform: scale(1); }
  50%      { opacity: 0.08; transform: scale(0.5); }
}

/* Estrella fugaz */
.shoot {
  position: fixed;
  width: var(--len);
  height: 2px;
  border-radius: 2px;
  z-index: 1;
  pointer-events: none;
  animation: shooting var(--sd) linear infinite var(--sdel);
  transform: rotate(-30deg);
  transform-origin: left center;
}

@keyframes shooting {
  0%        { opacity:0; margin-left:0; }
  5%        { opacity:1; }
  100%      { opacity:0; margin-left:300px; }
}

/* Mensaje central */
#msg {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  text-align: center;
  width: 90vw;
  animation: entrada 2.5s ease forwards;
  opacity: 0;
}

@keyframes entrada {
  0%   { opacity:0; transform: translate(-50%,-60%) scale(0.8); }
  100% { opacity:1; transform: translate(-50%,-50%) scale(1); }
}

#msg h1 {
  font-size: clamp(30px, 9vw, 62px);
  font-weight: 700;
  letter-spacing: 3px;
  line-height: 1.35;
  margin-bottom: 16px;
  background: linear-gradient(90deg,#ff9de2,#ffd6ff,#a0c4ff,#c8b6ff,#ffd6ff,#ff9de2);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3.5s linear infinite;
}

@keyframes shimmer {
  to { background-position: 300% center; }
}

.hearts {
  font-size: clamp(30px, 8vw, 52px);
  display: block;
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.3); }
}

.sub {
  margin-top: 14px;
  font-size: clamp(12px, 3vw, 17px);
  color: rgba(255,210,245,0.55);
  letter-spacing: 5px;
  animation: entrada 4.5s ease forwards;
  opacity: 0;
}
</style>
</head>
<body>

<div id="msg">
  <h1>TE AMO MI PRINCESA 🥰</h1>
  <span class="hearts">💖 ✨ 💖</span>
  <p class="sub">para siempre &amp; por siempre</p>
</div>

<script>
const starChars = ['★','✦','✧','·','•','✸','✺','⊹'];
const starColors = [
  '#ffffff','#ffd6ff','#a0c4ff','#ff9de2',
  '#fffacd','#c8b6ff','#ffb3c6','#b9fbc0'
];
const shootColors = ['#ffffff','#ffd6ff','#a0c4ff','#ff9de2','#fffacd'];

// 200 estrellas
for (let i = 0; i < 200; i++) {
  const el = document.createElement('span');
  el.className = 'star';
  const size  = Math.random() * 18 + 8;         // 8px – 26px
  const char  = starChars[Math.floor(Math.random() * starChars.length)];
  const color = starColors[Math.floor(Math.random() * starColors.length)];
  const dur   = (Math.random() * 3 + 1.2).toFixed(1) + 's';
  const del   = '-' + (Math.random() * 5).toFixed(1) + 's';

  el.textContent = char;
  el.style.cssText = `
    left:${Math.random()*100}vw;
    top:${Math.random()*100}vh;
    font-size:${size}px;
    color:${color};
    --d:${dur};
    --del:${del};
  `;
  document.body.appendChild(el);
}

// 8 estrellas fugaces
for (let i = 0; i < 8; i++) {
  const el = document.createElement('div');
  el.className = 'shoot';
  const len   = Math.floor(Math.random() * 100 + 80);
  const color = shootColors[Math.floor(Math.random() * shootColors.length)];
  const sd    = (Math.random() * 3 + 2).toFixed(1) + 's';
  const sdel  = '-' + (Math.random() * 12).toFixed(1) + 's';

  el.style.cssText = `
    left:${Math.random()*70}vw;
    top:${Math.random()*50}vh;
    --len:${len}px;
    background: linear-gradient(to right, transparent, ${color}, transparent);
    --sd:${sd};
    --sdel:${sdel};
  `;
  document.body.appendChild(el);
}
</script>
</body>
</html>
