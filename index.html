<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te Amo Mi Princesa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020818;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    #mensaje {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: aparecer 3s ease forwards;
      opacity: 0;
      padding: 20px;
    }

    #mensaje h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 58px);
      font-weight: 700;
      background: linear-gradient(90deg, #ff9de2, #ffd6ff, #a0c4ff, #c8b6ff, #ffd6ff, #ff9de2);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: brillar 4s linear infinite;
      line-height: 1.3;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    #corazones {
      font-size: clamp(24px, 5vw, 44px);
      animation: latir 1.5s ease-in-out infinite;
      display: block;
      margin-top: 10px;
    }

    #subtitulo {
      font-family: 'Georgia', serif;
      font-size: clamp(14px, 2.5vw, 20px);
      color: rgba(255, 200, 240, 0.7);
      margin-top: 16px;
      letter-spacing: 4px;
      animation: aparecer 5s ease forwards;
      opacity: 0;
    }

    @keyframes brillar {
      0%   { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    @keyframes aparecer {
      0%   { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes latir {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.25); }
    }
  </style>
</head>
<body>

<canvas id="cielo"></canvas>

<div id="mensaje">
  <h1>TE AMO MI PRINCESA 🥰</h1>
  <span id="corazones">💖 ✨ 💖</span>
  <p id="subtitulo">para siempre &amp; por siempre</p>
</div>

<script>
  const canvas = document.getElementById('cielo');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colores = [
    '#ffffff','#ffd6ff','#a0c4ff','#ff9de2',
    '#fffacd','#c8b6ff','#ffb3c6','#b9fbc0'
  ];

  const estrellas = Array.from({ length: 250 }, () => ({
    x:      Math.random(),
    y:      Math.random(),
    r:      Math.random() * 2 + 0.3,
    color:  colores[Math.floor(Math.random() * colores.length)],
    fase:   Math.random() * Math.PI * 2,
    vel:    Math.random() * 0.025 + 0.005
  }));

  const fugaces = [];
  let ultimaFugaz = 0;

  function lanzarFugaz() {
    fugaces.push({
      x:     Math.random() * 0.75,
      y:     Math.random() * 0.45,
      largo: Math.random() * 140 + 60,
      vel:   Math.random() * 4 + 3,
      alpha: 1,
      color: colores[Math.floor(Math.random() * colores.length)]
    });
  }

  function dibujar(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const W = canvas.width, H = canvas.height;

    estrellas.forEach(s => {
      const brillo = 0.4 + 0.6 * Math.sin(t * s.vel + s.fase);
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r * brillo + 0.1, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = 0.35 + 0.65 * brillo;
      ctx.fill();
    });

    if (t - ultimaFugaz > 2.2 + Math.random() * 2.5) {
      lanzarFugaz();
      ultimaFugaz = t;
    }

    for (let i = fugaces.length - 1; i >= 0; i--) {
      const f = fugaces[i];
      ctx.beginPath();
      ctx.moveTo(f.x * W, f.y * H);
      ctx.lineTo(f.x * W - f.largo, f.y * H + f.largo * 0.28);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 1.8;
      ctx.globalAlpha = f.alpha;
      ctx.stroke();
      f.x     += f.vel * 0.0035;
      f.y     += f.vel * 0.001;
      f.alpha -= 0.016;
      if (f.alpha <= 0) fugaces.splice(i, 1);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(ts => dibujar(ts / 1000));
  }

  requestAnimationFrame(ts => dibujar(ts / 1000));
</script>
</body>
</html>
